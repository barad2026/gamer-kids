<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sign Up | Gamer Kids</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 80% 10%,
            rgba(0,170,255,.16),
            transparent 30%
        ),

        radial-gradient(
            circle at 10% 90%,
            rgba(120,60,255,.13),
            transparent 30%
        ),

        #050811;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;
}


a{
    text-decoration:none;
    color:inherit;
}


.container{

    width:100%;

    max-width:470px;
}


.logo{

    text-align:center;

    font-size:30px;

    font-weight:900;

    margin-bottom:30px;
}


.logo span{
    color:#3ddcff;
}


.card{

    padding:35px;

    border-radius:25px;

    background:

        linear-gradient(
            145deg,
            rgba(18,29,49,.96),
            rgba(7,12,22,.98)
        );

    border:
        1px solid rgba(255,255,255,.09);

    box-shadow:
        0 30px 80px rgba(0,0,0,.5);
}


h1{

    text-align:center;

    font-size:30px;

    margin-bottom:8px;
}


.subtitle{

    text-align:center;

    color:#8996aa;

    font-size:13px;

    margin-bottom:28px;
}


.form-group{

    margin-bottom:17px;
}


label{

    display:block;

    color:#cbd5e5;

    font-size:13px;

    margin-bottom:8px;
}


input{

    width:100%;

    padding:14px 15px;

    border-radius:12px;

    border:
        1px solid rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.045);

    color:white;

    outline:none;

    font-family:inherit;

    transition:.2s;
}


input:focus{

    border-color:#3ddcff;

    box-shadow:
        0 0 0 3px
        rgba(61,220,255,.08);
}


input::placeholder{
    color:#667389;
}


.password-box{
    position:relative;
}


.password-box input{
    padding-left:60px;
}


.show-password{

    position:absolute;

    left:10px;

    top:50%;

    transform:
        translateY(-50%);

    border:0;

    background:transparent;

    color:#8290a7;

    cursor:pointer;

    font-size:16px;
}


/* ROLE CODE */

.role-box{

    margin-top:20px;

    padding:16px;

    border-radius:15px;

    background:
        rgba(61,220,255,.045);

    border:
        1px solid rgba(61,220,255,.15);
}


.role-title{

    font-size:13px;

    font-weight:bold;

    color:#dce7f7;

    margin-bottom:5px;
}


.role-description{

    font-size:11px;

    color:#8290a7;

    margin-bottom:12px;
}


.role-result{

    margin-top:9px;

    font-size:11px;

    min-height:18px;
}


.signup-btn{

    width:100%;

    padding:14px;

    border:0;

    border-radius:13px;

    background:

        linear-gradient(
            135deg,
            #477fff,
            #7657ff
        );

    color:white;

    font-family:inherit;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

    margin-top:18px;
}


.signup-btn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(70,100,255,.25);
}


.message{

    display:none;

    padding:11px;

    border-radius:10px;

    margin-bottom:15px;

    text-align:center;

    font-size:12px;
}


.error{

    display:block;

    background:
        rgba(255,70,70,.1);

    border:
        1px solid rgba(255,70,70,.25);

    color:#ff9292;
}


.success{

    display:block;

    background:
        rgba(70,255,150,.1);

    border:
        1px solid rgba(70,255,150,.25);

    color:#78ffb0;
}


.login{

    text-align:center;

    margin-top:22px;

    color:#8996aa;

    font-size:13px;
}


.login a{

    color:#3ddcff;

    font-weight:bold;
}


.back{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#7e8ba0;

    font-size:12px;
}


@media(max-width:500px){

    .card{
        padding:25px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="logo">
        GAMER <span>KIDS</span>
    </div>


    <div class="card">


        <h1>
            ساخت حساب 🎮
        </h1>


        <div class="subtitle">
            به Gamer Kids ملحق شو
        </div>


        <div
            id="message"
            class="message"
        ></div>


        <form id="signupForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="مثلاً Barad"
                    minlength="3"
                    maxlength="20"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="حداقل 8 کاراکتر"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="تکرار رمز عبور"
                    required
                >

            </div>


            <!-- ROLE CODE -->

            <div class="role-box">

                <div class="role-title">
                    🎟️ Role Code
                    <span style="color:#718097">
                        (اختیاری)
                    </span>
                </div>


                <div class="role-description">

                    اگر کد نداری، خالی بگذار.
                    در این صورت نقش تو به صورت خودکار
                    <b>GAMER</b> خواهد بود.

                </div>


                <input
                    type="text"
                    id="roleCode"
                    placeholder="Role Code را وارد کنید..."
                    autocomplete="off"
                >


                <div
                    id="roleResult"
                    class="role-result"
                ></div>

            </div>


            <button
                type="submit"
                class="signup-btn"
            >
                🚀 CREATE ACCOUNT
            </button>


        </form>


        <div class="login">

            قبلاً حساب ساخته‌ای؟

            <a href="login.html">
                Login
            </a>

        </div>


        <a
            href="index.html"
            class="back"
        >
            ← بازگشت به Gamer Kids
        </a>


    </div>

</div>


<script>

const form =
    document.getElementById("signupForm");

const message =
    document.getElementById("message");

const roleCode =
    document.getElementById("roleCode");

const roleResult =
    document.getElementById("roleResult");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const showPassword =
    document.getElementById("showPassword");


/*
   نمونه کدها

   این‌ها فقط برای DEMO هستند.
   برای سایت واقعی نباید Role Code
   را داخل JavaScript عمومی نگه داشت.
*/

const ROLE_CODES = {

    "AHOORA-ADMIN":
        "ADMIN",

    "AMIR-ADMIN":
        "ADMIN",

    "BARAD-OWNER":
        "OWNER"

};


/* نمایش نقش */

roleCode.addEventListener(
    "input",
    function(){

        const code =
            this.value.trim();

        if(code === ""){

            roleResult.textContent =
                "🎮 نقش شما: GAMER";

            roleResult.style.color =
                "#8d9bb1";

            return;
        }


        const role =
            ROLE_CODES[code];


        if(role === "OWNER"){

            roleResult.textContent =
                "👑 کد معتبر — OWNER";

            roleResult.style.color =
                "#ffd45a";

        }

        else if(role === "ADMIN"){

            roleResult.textContent =
                "🛡️ کد معتبر — ADMIN";

            roleResult.style.color =
                "#70adff";

        }

        else{

            roleResult.textContent =
                "❌ کد معتبر نیست";

            roleResult.style.color =
                "#ff8585";
        }

    }
);


/* نمایش پسورد */

showPassword.addEventListener(
    "click",
    function(){

        if(password.type === "password"){

            password.type = "text";

            this.textContent = "🙈";

        }
        else{

            password.type = "password";

            this.textContent = "👁";

        }

    }
);


/* ثبت نام */

form.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        message.className =
            "message";


        const username =
            document
            .getElementById("username")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const pass =
            password.value;


        const confirm =
            confirmPassword.value;


        const code =
            roleCode.value.trim();


        /* بررسی رمز */

        if(pass !== confirm){

            message.textContent =
                "❌ رمز عبور و تکرار آن یکسان نیست.";

            message.classList.add("error");

            return;
        }


        /* بررسی Role */

        let role = "GAMER";


        if(code !== ""){

            if(!ROLE_CODES[code]){

                message.textContent =
                    "❌ Role Code اشتباه است.";

                message.classList.add("error");

                return;
            }


            role =
                ROLE_CODES[code];
        }


        /*
           فعلاً حساب واقعی ساخته نمی‌شود.
           در مرحله بعد اینجا را به Authentication
           واقعی وصل می‌کنیم.
        */


        message.textContent =
            "ثبت‌نام آماده است — Role شما: " + role;

        message.classList.add("success");

        console.log({
            username,
            email,
            role
        });

    }
);

</script>


</body>
</html>
