<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GM Kids Gaming</title>

<style>

*{
box-sizing:border-box;
font-family:tahoma;
}

body{
margin:0;
background:#0b0b0b;
color:white;
}

header{
background:#111;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 0 20px #00ff88;
}

.logo{
font-size:28px;
color:#00ff88;
font-weight:bold;
}

button{
background:#00ff88;
border:0;
padding:12px 25px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.hero{
text-align:center;
padding:80px 20px;
background:
linear-gradient(#0008,#0008),
url("https://images.unsplash.com/photo-1542751371-adc38448a05e");
background-size:cover;
}


.hero h1{
font-size:45px;
}


.cards{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
padding:40px;
}


.card{
background:#151515;
padding:25px;
width:300px;
border-radius:20px;
text-align:center;
border:1px solid #333;
}


.card:hover{
border-color:#00ff88;
transform:translateY(-5px);
}


.modal{

display:none;
position:fixed;
inset:0;
background:#000b;
justify-content:center;
align-items:center;

}


.box{

background:#151515;
padding:30px;
border-radius:20px;
width:350px;

}


input{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:0;

}


#panel{

display:none;
padding:40px;
background:#111;

}


.role{

color:#00ff88;
font-size:20px;

}


footer{

text-align:center;
padding:20px;
background:#111;

}


</style>

</head>


<body>


<header>

<div class="logo">
GM Kids Gaming
</div>


<button onclick="openLogin()">
ورود
</button>


</header>



<section class="hero">

<h1>
به تیم گیمینگ ما خوش آمدید 🎮
</h1>

<p>
ویدیو، پروژه ها و اخبار گیمینگ
</p>

</section>




<section class="cards">


<div class="card">

<h2>
🎬 ویدیو ها
</h2>

<p>
ویدیوهای آپارات ما
</p>

<a href="video.html">
<button>
مشاهده
</button>
</a>

</div>



<div class="card">

<h2>
Minecraft
</h2>

<p>
پروژه های ماینکرفت
</p>

</div>




<div class="card">

<h2>
Roblox
</h2>

<p>
بازی های روبلاکس
</p>

</div>


</section>




<div id="login" class="modal">


<div class="box">


<h2>
ورود
</h2>


<input id="code" placeholder="Role Code">


<button onclick="login()">
ورود
</button>


<p id="msg"></p>


</div>


</div>





<div id="panel">


<h1>
پنل کاربری
</h1>


<p>
Role:
<span id="role" class="role"></span>
</p>


<button onclick="logout()">
خروج
</button>


</div>





<footer>

GM Kids Gaming © 2026

</footer>





<script>


const OWNER_CODE="bbolhasani1394";

const ADMIN_CODE="1234567890";



function openLogin(){

document.getElementById("login").style.display="flex";

}



function login(){


let code=document.getElementById("code").value;


if(code===OWNER_CODE){


localStorage.setItem("role","Owner");


showPanel("Owner");


}


else if(code===ADMIN_CODE){


localStorage.setItem("role","Admin");


showPanel("Admin");


}


else{


document.getElementById("msg").innerHTML=
"❌ کد اشتباه است";


}


}



function showPanel(role){

document.getElementById("login").style.display="none";

document.querySelector(".hero").style.display="none";


document.getElementById("panel").style.display="block";


document.getElementById("role").innerHTML=role;


}



function logout(){

localStorage.removeItem("role");

location.reload();

}




window.onload=function(){

let role=localStorage.getItem("role");


if(role){

showPanel(role);

}


}



</script>


</body>

</html>
