<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GM Kids Gaming</title>

<style>

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:tahoma;
}

header{
    text-align:center;
    padding:30px;
    background:linear-gradient(45deg,#00ff88,#0088ff);
    color:black;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
}


.box{

    background:#111;
    margin:30px 0;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 20px #00ff8855;

}


input{

    width:100%;
    padding:15px;
    margin:10px 0;

    background:#222;
    color:white;

    border:none;
    border-radius:15px;

}


button{

    padding:15px 30px;
    border:none;
    border-radius:30px;
    cursor:pointer;

    background:#00ff88;
    font-size:18px;

}


.hidden{

display:none;

}


.role{

padding:15px;
border-radius:15px;
background:#222;
color:#00ff88;

}


.video{

background:#181818;
padding:20px;
border-radius:20px;
margin-top:20px;

}


iframe{

width:100%;
height:400px;
border-radius:15px;

}

</style>

</head>


<body>


<header>

<h1>
🎮 GM Kids Gaming
</h1>

<p>
Minecraft | Roblox | Gaming
</p>

</header>



<div class="container">


<div class="box" id="login">


<h2>
🔐 ورود
</h2>


<input id="username"
placeholder="نام کاربری">


<input id="code"
placeholder="Role Code">


<button onclick="login()">
ورود
</button>


</div>




<div class="box hidden" id="panel">


<h2>
خوش آمدی
<span id="name"></span>
</h2>


<div class="role">

نقش:
<span id="role"></span>

</div>


<br>


<button onclick="logout()">
خروج
</button>



<h2>
📺 ویدیوها
</h2>



<div class="video">

<h3>
Minecraft
</h3>


<iframe
src="https://www.aparat.com/video/video/embed/videohash/XXXX/vt/frame">
</iframe>


</div>



<div class="video">

<h3>
Roblox
</h3>


<iframe
src="https://www.aparat.com/video/video/embed/videohash/YYYY/vt/frame">
</iframe>


</div>



</div>


</div>





<script>


// تنظیمات کاربران


let ownerUsed =
localStorage.getItem("ownerUsed");



const ADMIN_CODE =
"1234567890";


const OWNER_CODE =
"bbolhasani1394";





function login(){


let username =
document.getElementById("username").value;


let code =
document.getElementById("code").value;



let role="";



// Owner یک بار مصرف


if(code===OWNER_CODE){


    if(ownerUsed){

        alert("❌ کد Owner قبلا استفاده شده");

        return;

    }


    role="Owner";


    localStorage.setItem(
        "ownerUsed",
        "true"
    );


}



// Admin نامحدود


else if(code===ADMIN_CODE){


    role="Admin";


}



else{


alert("❌ Role Code اشتباه است");

return;


}





let user={

username:username,

role:role

};



localStorage.setItem(

"gmUser",

JSON.stringify(user)

);



showPanel(user);


}





function showPanel(user){


document
.getElementById("login")
.classList.add("hidden");


document
.getElementById("panel")
.classList.remove("hidden");



document
.getElementById("name")
.innerHTML=user.username;



document
.getElementById("role")
.innerHTML=user.role;



}




function logout(){


localStorage.removeItem(
"gmUser"
);


location.reload();


}




// ورود قبلی


let saved =
localStorage.getItem("gmUser");



if(saved){


showPanel(
JSON.parse(saved)
);


}


</script>



</body>

</html>
