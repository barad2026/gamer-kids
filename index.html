<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GM Kids Gaming 🎮</title>

<style>

*{
    box-sizing:border-box;
    font-family:tahoma,Arial;
}

body{
    margin:0;
    background:#050505;
    color:white;
}


header{

    padding:25px;
    text-align:center;
    background:
    linear-gradient(135deg,#00ff88,#0088ff);

    color:#000;

}


header h1{
    font-size:45px;
    margin:0;
}



.container{

    width:90%;
    max-width:1000px;
    margin:auto;

}


.card{

    background:#111;
    margin:25px 0;
    padding:25px;
    border-radius:25px;

    box-shadow:
    0 0 20px #00ff8844;

}



input{

    width:100%;
    padding:15px;

    margin:10px 0;

    border-radius:15px;

    border:none;

    background:#222;

    color:white;

    font-size:18px;

}



button{

    background:#00ff88;

    color:#000;

    border:none;

    padding:15px 30px;

    border-radius:30px;

    cursor:pointer;

    font-size:18px;

}



button:hover{

    transform:scale(1.05);

}



.hidden{

    display:none;

}



.video{

    background:#181818;

    padding:20px;

    border-radius:20px;

    margin:20px 0;

}


iframe{

    width:100%;

    height:400px;

    border-radius:15px;

}



.member{

    padding:15px;

    background:#222;

    border-radius:15px;

    margin:10px;

    color:#00ff88;

}


footer{

    text-align:center;

    padding:30px;

    color:#777;

}


</style>

</head>


<body>


<header>

<h1>
🎮 GM Kids Gaming
</h1>

<p>
Minecraft | Roblox | Gaming
</p>

</header>



<div class="container">



<!-- LOGIN -->

<div class="card" id="loginBox">

<h2>
🔐 ورود اعضا
</h2>


<input id="username"
placeholder="نام کاربری">


<input id="password"
type="password"
placeholder="رمز عبور">



<button onclick="login()">

ورود

</button>


</div>





<!-- PANEL -->

<div class="card hidden" id="panel">


<h2>
🔥 خوش آمدی
<span id="user"></span>
</h2>


<button onclick="logout()">
خروج
</button>


<h2>
👥 اعضای تیم
</h2>


<div class="member">
🎮 Barad - Owner
</div>


<div class="member">
🎮 Mahan - Member
</div>


<div class="member">
🎮 Amir - Member
</div>




<h2>
📺 ویدیوها
</h2>



<div class="video">


<h3>
Minecraft Gameplay
</h3>


<!-- لینک آپارات را اینجا بگذار -->

<iframe
src="https://www.aparat.com/video/video/embed/videohash/XXXXX/vt/frame"
allowfullscreen>
</iframe>


</div>



<div class="video">


<h3>
Roblox Gameplay
</h3>


<iframe
src="https://www.aparat.com/video/video/embed/videohash/YYYYY/vt/frame"
allowfullscreen>
</iframe>


</div>



</div>



</div>




<footer>

GM Kids Gaming © 2026

</footer>






<script>


// کاربران سایت

const users=[

{
username:"barad",
password:"1234",
role:"Owner"
},

{
username:"mahan",
password:"1234",
role:"Member"
},

{
username:"amir",
password:"1234",
role:"Member"
}

];




// ورود

function login(){


let username=
document.getElementById("username").value;


let password=
document.getElementById("password").value;



let user=users.find(

u=>

u.username===username &&
u.password===password

);



if(user){


localStorage.setItem(
"gm_user",
JSON.stringify(user)
);



showPanel(user);


}

else{


alert("❌ نام کاربری یا رمز اشتباه است");


}


}





function showPanel(user){


document.getElementById("loginBox")
.classList.add("hidden");


document.getElementById("panel")
.classList.remove("hidden");


document.getElementById("user")
.innerHTML=
user.username;



}





function logout(){


localStorage.removeItem("gm_user");


location.reload();


}





// بررسی ورود قبلی


let saved=
localStorage.getItem("gm_user");



if(saved){


showPanel(
JSON.parse(saved)
);


}



</script>


</body>

</html>
